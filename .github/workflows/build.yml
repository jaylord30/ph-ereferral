name: Build IG

on:
  workflow_call:

jobs:
  sushi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Sushi
        run: npm install -g fsh-sushi

      - name: Run Sushi
        run: sushi .

      - name: Upload FHIR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fhir-artifacts
          path: |
            **/*.json
            **/*.xml
            **/*.fsh